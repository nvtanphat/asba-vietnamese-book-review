[project]
name = "sentenai-api"
version = "0.3.0"
description = "FastAPI gateway for the promoted SentenAI unified ABSA artifact with legacy PhoBERT fallback."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0",
    "requests>=2.31",
    "slowapi>=0.1.9",
    "psycopg[binary]>=3.1",
    "absa-core[onnx]",
]

[tool.uv.sources]
absa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
