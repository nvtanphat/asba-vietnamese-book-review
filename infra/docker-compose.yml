# SentenAI — local prod-like stack.
# Dev default is SQLite + `make api` / `make web`; this compose adds Postgres.
#
# Usage: create infra/.env (see infra/.env.example) with at least JWT_SECRET set to a
# real random value (`openssl rand -hex 32`), then: docker compose -f infra/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    profiles: ["mlops"]
    build:
      context: ..
      dockerfile: infra/mlflow.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ABSA_ARTIFACT_DIR: /app/artifacts/final
      ABSA_PREFER_UNIFIED_ARTIFACT: "1"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env (openssl rand -hex 32) before running this stack}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  mlflowdata:
