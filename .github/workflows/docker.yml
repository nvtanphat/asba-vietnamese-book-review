name: Docker build
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/absa_core/**"
      - "infra/**"
      - "artifacts/final/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api.Dockerfile . -t sentenai-api:test
      - run: docker build -f infra/web.Dockerfile . -t sentenai-web:test
