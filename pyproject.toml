[project]
name = "sentenai-unified"
version = "0.1.0"
description = "SentenAI Unified — reproducible Vietnamese ABSA research, fair benchmarking, and production dashboard."
requires-python = ">=3.10"
readme = "README.md"

# Aggregate dependencies so `uv sync` at the root provisions the whole backend.
dependencies = [
    "absa-core",
    "sentenai-api",
    "PyYAML>=6.0",
]

[tool.uv.sources]
absa-core = { workspace = true }
sentenai-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
ml = ["PyYAML>=6.0", "optuna>=3.6", "peft>=0.12", "sentencepiece>=0.2", "accelerate>=0.29", "matplotlib>=3.8", "plotly>=5.20", "streamlit>=1.35", "fake-useragent>=1.5", "tqdm>=4.66"]
legacy-research = ["seaborn", "wordcloud", "networkx", "gensim", "underthesea", "py-vncorenlp", "umap-learn", "datasets"]
mlops = ["mlflow>=3.1,<4", "dvc>=3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/absa_core/tests", "apps/api/tests"]
pythonpath = [".", "packages/absa_core", "apps/api"]
norecursedirs = ["ml/legacy_phobert", "scripts/migrated_notebooks", ".git", ".venv", "node_modules"]

[tool.ruff.lint]
ignore = ["B008"]
